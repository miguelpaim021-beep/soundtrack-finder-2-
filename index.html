<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SoundTrack Finder</title>

  <!-- Ícone do separador do navegador (Favicon) -->
  <link rel="icon" type="image/png" href="favicon.png.png">

  <!-- Fonte Inter (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Visual da página -->
  <link rel="stylesheet" href="style.css">

  <!-- PyScript -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
</head>
<body>
  <div class="app">

    <!-- ================= TOPO ================= -->
    <header class="topbar">

      <div class="menu-wrap">
        <button id="menu-btn" class="icone" data-acao="menu" type="button"
                aria-label="Abrir menu" data-i18n-aria="menu_aria" aria-expanded="false">☰</button>

        <nav id="menu-popup" class="menu-popup" hidden>
          <button class="menu-opcao" data-acao="ir-albuns" type="button">
            <span class="menu-icone">💿</span>
            <span class="menu-texto"><strong data-i18n="menu_albuns">Álbuns</strong><small data-i18n="menu_albuns_sub">Suas playlists</small></span>
            <span class="menu-qtd" id="menu-qtd-albuns">0</span>
          </button>
          <button class="menu-opcao" data-acao="ir-favoritos" type="button">
            <span class="menu-icone">⭐</span>
            <span class="menu-texto"><strong data-i18n="menu_favoritos">Favoritos</strong><small data-i18n="menu_favoritos_sub">Músicas favoritas</small></span>
            <span class="menu-qtd" id="menu-qtd-favoritos">0</span>
          </button>
          <button class="menu-opcao" data-acao="ir-downloads" type="button">
            <span class="menu-icone">⬇️</span>
            <span class="menu-texto"><strong data-i18n="menu_downloads">Downloads</strong><small data-i18n="menu_downloads_sub">Músicas baixadas</small></span>
            <span class="menu-qtd" id="menu-qtd-downloads">0</span>
          </button>
          <button class="menu-opcao" data-acao="ir-local" type="button">
            <span class="menu-icone">📂</span>
            <span class="menu-texto"><strong data-i18n="menu_local">Dispositivo</strong><small data-i18n="menu_local_sub">Músicas locais</small></span>
            <span class="menu-qtd" id="menu-qtd-local">0</span>
          </button>
        </nav>
      </div>

      <button class="marca" data-acao="ir-busca" type="button">
        <span class="marca-logo">♪</span>
        <span class="marca-nome">SoundTrack</span>
      </button>

      <form id="search-form">
        <input id="search-input" type="text" placeholder="Busque um artista ou música…" data-i18n-placeholder="buscar_placeholder" autocomplete="off">
        <button id="search-btn" type="submit" data-i18n="buscar_btn">Buscar</button>
      </form>

      <!-- Seletor de idioma (entre a busca e o tema) -->
      <div class="idioma-wrap">
        <button id="lang-btn" class="icone idioma-btn" data-acao="idioma" type="button"
                title="Idioma" data-i18n-title="idioma_titulo"
                aria-label="Idioma" data-i18n-aria="idioma_titulo" aria-expanded="false">
          <span aria-hidden="true">🌐</span><span id="lang-atual">PT</span>
        </button>

        <nav id="lang-popup" class="menu-popup lang-popup" hidden>
          <button class="menu-opcao" data-acao="escolher-idioma" data-idioma="pt" type="button">
            <span class="menu-icone codigo">PT</span>
            <span class="menu-texto"><strong>Português</strong></span>
          </button>
          <button class="menu-opcao" data-acao="escolher-idioma" data-idioma="en" type="button">
            <span class="menu-icone codigo">EN</span>
            <span class="menu-texto"><strong>English</strong></span>
          </button>
          <button class="menu-opcao" data-acao="escolher-idioma" data-idioma="es" type="button">
            <span class="menu-icone codigo">ES</span>
            <span class="menu-texto"><strong>Español</strong></span>
          </button>
        </nav>
      </div>

      <button id="theme-btn" class="icone" type="button" title="Alternar tema" data-i18n-title="tema_titulo">🌓</button>
    </header>

    <!-- ================= ECRÃS ================= -->
    <div class="scroll" id="scroll">

      <section id="tela-busca">
        <p id="status">Digite algo para começar.</p>
        <main id="grid"></main>
      </section>

      <section id="tela-favoritos" hidden></section>
      <section id="tela-downloads" hidden></section>
      <section id="tela-local" hidden></section>

      <section id="tela-albuns" hidden>
        <div class="tela-topo">
          <div>
            <h1 data-i18n="menu_albuns">Álbuns</h1>
            <p id="albuns-sub">0 álbuns</p>
          </div>
        </div>

        <form id="album-form" class="album-form">
          <input id="album-input" type="text" placeholder="Nome do novo álbum…" data-i18n-placeholder="album_novo_placeholder" maxlength="40" autocomplete="off">
          <button type="submit" data-i18n="criar_album_btn">＋ Criar álbum</button>
        </form>

        <div id="albuns-grid" class="albuns-grid"></div>
      </section>

      <section id="tela-album" hidden></section>
    </div>

    <!-- ================= PLAYER FIXO ================= -->
    <footer class="player-bar">
      <div class="tocando">
        <div class="tocando-capa" id="np-capa">♪</div>
        <div class="tocando-info">
          <strong id="np-nome" data-i18n="np_nome_vazio">Nada tocando</strong>
          <span id="np-artista" data-i18n="np_artista_vazio">Escolha uma música para ouvir</span>
        </div>
      </div>
      <audio id="player" controls preload="none"></audio>
    </footer>

    <div id="toast" class="toast" role="status"></div>
  </div>

  <!-- Funções JavaScript para pastas locais e downloads -->
  <script>
    window.localMusicas = [];

    // Pede ao Python (main.py) o texto traduzido; usa o padrão se ele ainda não carregou.
    const tr = (chave, padrao, n) => (window.traduzir ? window.traduzir(chave, n) : padrao);

    async function selecionarPastaDispositivo() {
      if (!window.showDirectoryPicker) {
        alert(tr("alerta_sem_suporte", "Seu navegador não suporta a abertura de pastas locais."));
        return;
      }
      try {
        const dirHandle = await window.showDirectoryPicker();
        window.localMusicas = [];
        
        for await (const entry of dirHandle.values()) {
          if (entry.kind === 'file') {
            const file = await entry.getFile();
            const ext = file.name.split('.').pop().toLowerCase();
            if (['mp3', 'm4a', 'wav', 'aac', 'ogg', 'flac'].includes(ext)) {
              const audioUrl = URL.createObjectURL(file);
              window.localMusicas.push({
                id: 'local_' + file.name,
                nome: file.name.replace(/\.[^/.]+$/, ""),
                artista: tr("pasta_local", "Pasta Local"),
                capa: "",
                audio: audioUrl
              });
            }
          }
        }
        alert(tr("alerta_encontradas", `${window.localMusicas.length} músicas de áudio encontradas na pasta!`, window.localMusicas.length));
        
        if (window.atualizarTelaLocalPy) {
          window.atualizarTelaLocalPy();
        }
      } catch (err) {
        console.log("Seleção de pasta cancelada ou erro.", err);
      }
    }

    async function baixarArquivoNoAparelho(url, nomeArquivo) {
      const nomeFormatado = nomeArquivo.endsWith(".m4a") ? nomeArquivo : nomeArquivo + ".m4a";
      const a = document.createElement("a");
      a.href = url;
      a.download = nomeFormatado;
      a.target = "_blank";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>

  <!-- Script Python (PyScript) -->
  <script type="py" src="./main.py" config="./pyscript.toml"></script>
</body>
</html>
