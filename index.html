<!DOCTYPE html>
<!--
  SoundTrack Finder — ESTRUTURA DA PÁGINA (HTML)
-->
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SoundTrack Finder</title>

  <!-- Fonte Inter (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Visual da página -->
  <link rel="stylesheet" href="style.css">

  <!-- PyScript: ferramenta que permite rodar Python dentro do navegador -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.11.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
</head>
<body>
  <div class="app">

    <!-- ================= TOPO ================= -->
    <header class="topbar">

      <!-- Botão ☰ (canto superior esquerdo) + pop-up com as opções -->
      <div class="menu-wrap">
        <button id="menu-btn" class="icone" data-acao="menu" type="button"
                aria-label="Abrir menu" aria-expanded="false">☰</button>

        <nav id="menu-popup" class="menu-popup" hidden>
          <button class="menu-opcao" data-acao="ir-albuns" type="button">
            <span class="menu-icone">💿</span>
            <span class="menu-texto"><strong>Álbuns</strong><small>Suas playlists</small></span>
            <span class="menu-qtd" id="menu-qtd-albuns">0</span>
          </button>
          <button class="menu-opcao" data-acao="ir-favoritos" type="button">
            <span class="menu-icone">⭐</span>
            <span class="menu-texto"><strong>Favoritos</strong><small>Músicas favoritas</small></span>
            <span class="menu-qtd" id="menu-qtd-favoritos">0</span>
          </button>
          <button class="menu-opcao" data-acao="ir-downloads" type="button">
            <span class="menu-icone">⬇️</span>
            <span class="menu-texto"><strong>Downloads</strong><small>Músicas baixadas</small></span>
            <span class="menu-qtd" id="menu-qtd-downloads">0</span>
          </button>
          <button class="menu-opcao" data-acao="ir-local" type="button">
            <span class="menu-icone">📂</span>
            <span class="menu-texto"><strong>Dispositivo</strong><small>Músicas locais</small></span>
            <span class="menu-qtd" id="menu-qtd-local">0</span>
          </button>
        </nav>
      </div>

      <!-- Clicar na marca volta para a busca -->
      <button class="marca" data-acao="ir-busca" type="button">
        <span class="marca-logo">♪</span>
        <span class="marca-nome">SoundTrack</span>
      </button>

      <!-- Barra de busca (Enter ou botão "Buscar") -->
      <form id="search-form">
        <input id="search-input" type="text" placeholder="Busque um artista ou música…" autocomplete="off">
        <button id="search-btn" type="submit">Buscar</button>
      </form>

      <!-- Alterna modo escuro / claro -->
      <button id="theme-btn" class="icone" type="button" title="Trocar tema">🌓</button>
    </header>

    <!-- ================= TELAS ================= -->
    <div class="scroll" id="scroll">

      <!-- TELA 1: Busca -->
      <section id="tela-busca">
        <p id="status">Digite algo para começar.</p>
        <main id="grid"></main>
      </section>

      <!-- TELA 2: Favoritos -->
      <section id="tela-favoritos" hidden></section>

      <!-- TELA 3: Downloads -->
      <section id="tela-downloads" hidden></section>

      <!-- TELA 4: Dispositivo (Local) -->
      <section id="tela-local" hidden></section>

      <!-- TELA 5: Lista de álbuns -->
      <section id="tela-albuns" hidden>
        <div class="tela-topo">
          <div>
            <h1>Álbuns</h1>
            <p id="albuns-sub">0 álbuns</p>
          </div>
        </div>

        <form id="album-form" class="album-form">
          <input id="album-input" type="text" placeholder="Nome do novo álbum…" maxlength="40" autocomplete="off">
          <button type="submit">＋ Criar álbum</button>
        </form>

        <div id="albuns-grid" class="albuns-grid"></div>
      </section>

      <!-- TELA 6: Um álbum aberto -->
      <section id="tela-album" hidden></section>
    </div>

    <!-- ================= PLAYER FIXO ================= -->
    <footer class="player-bar">
      <div class="tocando">
        <div class="tocando-capa" id="np-capa">♪</div>
        <div class="tocando-info">
          <strong id="np-nome">Nada tocando</strong>
          <span id="np-artista">Escolha uma música para ouvir</span>
        </div>
      </div>
      <audio id="player" controls preload="none"></audio>
    </footer>

    <!-- Aviso rápido -->
    <div id="toast" class="toast" role="status"></div>
  </div>

  <!-- Funções de integração com o aparelho -->
  <script>
    let pastaHandleGlobal = null;
    let localMusicas = [];

    async function selecionarPastaDispositivo() {
      if (!window.showDirectoryPicker) {
        alert("Seu navegador não suporta a abertura de pastas locais.");
        return;
      }
      try {
        const dirHandle = await window.showDirectoryPicker();
        localMusicas = [];
        
        for await (const entry of dirHandle.values()) {
          if (entry.kind === 'file') {
            const file = await entry.getFile();
            const ext = file.name.split('.').pop().toLowerCase();
            if (['mp3', 'm4a', 'wav', 'aac', 'ogg', 'flac'].includes(ext)) {
              const audioUrl = URL.createObjectURL(file);
              localMusicas.push({
                id: 'local_' + file.name,
                nome: file.name.replace(/\.[^/.]+$/, ""),
                artista: "Pasta Local",
                capa: "",
                audio: audioUrl
              });
            }
          }
        }
        alert(`${localMusicas.length} músicas de áudio encontradas na pasta!`);
        
        if (window.atualizarTelaLocalPy) {
          window.atualizarTelaLocalPy();
        }
      } catch (err) {
        console.log("Seleção de pasta cancelada ou erro.", err);
      }
    }

    async function baixarArquivoNoAparelho(url, nomeArquivo) {
      const nomeFormatado = nomeArquivo.endsWith(".m4a") ? nomeArquivo : nomeArquivo + ".m4a";
      const a = document.createElement("a");
      a.href = url;
      a.download = nomeFormatado;
      a.target = "_blank";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>

  <!-- Python carregado via PyScript -->
  <script type="py" src="./main.py" config="./pyscript.toml"></script>
</body>
</html>
